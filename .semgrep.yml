# Semgrep SAST Rule Configuration for FoodLine Campus
# Pursuant to Antigravity IDE Master Specification & MCP Blueprint (Phase 3)

rules:
  - id: no-hardcoded-credentials
    patterns:
      - pattern-either:
          - pattern: |
              $KEY = "..."
          - pattern: |
              $OBJ = { ..., apiKey: "...", ... }
          - pattern: |
              $OBJ = { ..., secret: "...", ... }
    message: "Potential hardcoded credential or secret detected. Use process.env instead."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: no-direct-eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: Function(...)
    message: "Use of eval() or dynamically generated Function() allows arbitrary code execution."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"

  - id: prevent-raw-sql-concatenation
    patterns:
      - pattern: |
          $DB.query("..." + $VAR + "...")
    message: "Avoid string concatenation in SQL queries to prevent SQL Injection. Use parameterized queries."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  - id: strict-cors-origin
    patterns:
      - pattern: |
          cors({ origin: '*' })
    message: "Wildcard CORS origin is discouraged in authenticated production environments. Restrict to authorized domains."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-942: Permissive Cross-Domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
