<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2C" />
      <stop offset="50%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#00D4AA" />
    </linearGradient>
    <linearGradient id="flGlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B2C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0.2" />
    </linearGradient>
    <filter id="flNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B2C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#0E0E15" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
  
  <!-- Subtle Ambient Glow Plate -->
  <circle cx="50" cy="50" r="34" fill="url(#flGlowGrad)" opacity="0.15" />

  <!-- Food Cloche Speed Curve -->
  <path d="M 28 58 C 28 38 72 38 72 58 Z" fill="none" stroke="url(#flPrimaryGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#flNeonGlow)" />

  <!-- Cloche Handle Knob -->
  <circle cx="50" cy="35" r="4.5" fill="url(#flPrimaryGrad)" />

  <!-- Main Express Line -->
  <path d="M 22 66 L 78 66" stroke="url(#flPrimaryGrad)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Speed Dashes -->
  <path d="M 32 74 L 68 74" stroke="#FFB347" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <path d="M 42 81 L 58 81" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.75" />

  <!-- Speed Bolt -->
  <path d="M 50 43 L 47 50 L 53 50 L 49 57" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
